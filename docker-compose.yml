# Production deployment for Dockploy.
#
# The database is a separate Dokploy-managed Database resource (MySQL),
# not part of this compose file — create/deploy it in the Dokploy UI and
# point DB_HOST/DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD at it via the
# app's environment variables. Dokploy injects those into the container,
# so a real .env file is not required (and is excluded from the image via
# .dockerignore). See README.md for the required variable list.
#
# Dockploy manages routing/SSL for whichever service you point a domain at
# in its UI (no Traefik labels needed here) — point it at the `app` service
# on port 80.

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            APP_NAME: ${APP_NAME:-Task Manager}
            APP_ENV: production
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL}
            APP_LOCALE: ${APP_LOCALE:-en}
            LOG_CHANNEL: ${LOG_CHANNEL:-stack}
            LOG_LEVEL: ${LOG_LEVEL:-error}
            DB_CONNECTION: mysql
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
        volumes:
            - app-storage:/var/www/html/storage/app

volumes:
    app-storage:
        driver: local
